            @media (prefers-color-scheme: dark) {

                    --sage: #8fb3a0;
                    --sage-deep: #a9c9b7;
                    --sage-ink: #a9c9b7;
                    --on-sage: #14201a;
                    --danger: #e08b84;
                    --sand: #1a1f1c;
                    --ink: #e8e8e8;
                    --muted: #9aa79f;

            }
            * { box-sizing: border-box; }
            html, body { height: 100%; }

                margin: 0;

                background: var(--sand);

                align-items: center;
                justify-content: center;
                padding: 24px;
                -webkit-font-smoothing: antialiased;
                /* iOS inflates text in landscape without this. */
                -webkit-text-size-adjust: 100%;
            }
            .hidden { display: none !important; }

            .staticrypt-page { width: 100%; max-width: 400px; }

            .brand {
                text-align: center;
                margin-bottom: 26px;
            }
            /* One slow breath — 4s in, 4s out. The only motion on the page. */
            .breath {
                width: 62px; height: 62px;
                margin: 0 auto 16px;
                border-radius: 50%;
                border: 1.5px solid var(--sage);
                display: flex; align-items: center; justify-content: center;
                animation: breathe 8s ease-in-out infinite;
            }
            .breath span { font-size: 24px; line-height: 1; }
            @keyframes breathe {
                0%, 100% { transform: scale(0.88); opacity: 0.55; }
                50%      { transform: scale(1.06); opacity: 1; }
            }
            @media (prefers-reduced-motion: reduce) {
                .breath { animation: none; opacity: 0.9; }
            }
            .brand h1 {
                margin: 0;
                font-size: 27px;
                font-weight: 300;
                letter-spacing: 0.04em;
                color: var(--sage);
            }
            .brand p {
                margin: 7px 0 0;
                font-size: 13.5px;
                color: var(--muted);
                font-weight: 300;
                line-height: 1.6;
            }

            .staticrypt-form {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 16px;
                padding: 26px 24px;
            }
            .staticrypt-instructions { text-align: center; }
            .staticrypt-title {
                margin: 0 0 6px;
                font-size: 15px;
                font-weight: 500;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                margin: 0;
                font-size: 13px;
                color: var(--muted);
                line-height: 1.65;
            }
            .staticrypt-hr {
                border: none;
                border-top: 1px solid var(--line);
                margin: 20px 0;
            }

            .staticrypt-password-container { position: relative; }
            #staticrypt-password {
                width: 100%;
                padding: 13px 15px;
                padding-left: 44px;
                font-family: inherit;
                /* 16px, not 15: under 16 iOS Safari zooms the page in the
                   moment this field takes focus and never zooms back out.
                   This is the first field anyone taps on the shared link, so
                   the whole site opened one pinch behind. The button below
                   stays 15px — it takes no text, so it triggers nothing. */
                font-size: 16px;
                color: var(--ink);
                background: transparent;
                border: 1px solid var(--line);
                border-radius: 10px;
                outline: none;
                transition: border-color 0.2s;
            }
            #staticrypt-password:focus { border-color: var(--sage); }
            #staticrypt-password::placeholder { color: var(--muted); opacity: 0.75; }

            .staticrypt-toggle-password-visibility {
                position: absolute;
                left: 14px; top: 50%;
                transform: translateY(-50%);
                width: 19px;
                cursor: pointer;
                opacity: 0.4;
                transition: opacity 0.2s;
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.75; }
            @media (prefers-color-scheme: dark) {
                .staticrypt-toggle-password-visibility { filter: invert(0.85); }
            }

            /* Inline, in place — the stock template raises a browser alert(),
               which on a shared link reads like something went wrong. */
            .gate-error {
                margin-top: 10px;
                font-size: 13px;
                color: var(--danger);
                text-align: center;
                min-height: 18px;
            }

            .staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 16px;
                font-size: 13px;
                color: var(--muted);
                cursor: pointer;
            }
            #staticrypt-remember { accent-color: var(--sage); width: 15px; height: 15px; cursor: pointer; }

            .staticrypt-decrypt-button {
                width: 100%;
                margin-top: 20px;
                padding: 13px;
                font-family: inherit;
                font-size: 15px;
                font-weight: 500;
                color: var(--on-sage);
                background: var(--sage);
                border: none;
                border-radius: 10px;
                cursor: pointer;
                transition: background 0.2s;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus { background: var(--sage-deep); }

            .foot {
                margin-top: 20px;
                text-align: center;
                font-size: 11.5px;
                color: var(--muted);
                opacity: 0.8;
                line-height: 1.7;
            }

            .staticrypt-spinner-container { text-align: center; padding: 60px 0; }
            .staticrypt-spinner {
                display: inline-block;
                width: 34px; height: 34px;
                border: 2px solid var(--line);
                border-top-color: var(--sage);
                border-radius: 50%;
                animation: spin 0.9s linear infinite;
            }
            @keyframes spin { to { transform: rotate(360deg); } }

                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            const errorBox = document.getElementById("gate-error");
            document.getElementById("staticrypt-password").addEventListener("input", function () {
                errorBox.textContent = "";
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const passwordInput = document.getElementById("staticrypt-password"),
                    password = passwordInput.value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                if (!password) {
                    errorBox.textContent = "צריך להזין סיסמה";
                    passwordInput.focus();
                    return;
                }

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    errorBox.textContent = templateError;
                    passwordInput.focus();
                    passwordInput.select();
                }
            });
        </script>
    </body>
</html>
