        <!-- The saved choice, applied before the first paint. Same key the
             dashboards behind this door use (dash_assets.theme_boot), and the
             same origin, so the door and the pages it opens agree. -->
        <script>
            (function () {
                try {
                    var t = localStorage.getItem("being.theme");
                    if (t === "dark" || t === "light")
                        document.documentElement.setAttribute("data-theme", t);
                } catch (e) {}
            })();
        </script>
        <style>
            /* being's share gate. The stock staticrypt page is a green box on a
               green background with an English "DECRYPT" button — the first
               thing anyone Roni shares with sees, and nothing to do with the
               place. This is the vault palette: sage, sand, one slow breath. */
            :root {
                --sage: #5a7a6a;
                --logo: #6c6467;
                --logo-accent: #7e5150;
                --sage-deep: #3d5a4d;
                --sage-ink: #41604f;
                --on-sage: #ffffff;
                --danger: #a4453f;
                --sand: #f5f0eb;
                --ink: #3a3a3a;
                --muted: #7a7a75;
                --card: #ffffff;
                --line: rgba(90, 122, 106, 0.18);
                /* The type and radius ladder — the gate's rungs (theme.ts),
                   restated because this door is a page of its own: staticrypt
                   takes it as a template and no dashboard sheet precedes it.
                   A rung read here and defined nowhere would fall to 16px and
                   square corners (review-code, 13/10/2026).
                   tests/test_dashboard_ladder.py holds the list equal. */
                --fs-1: 12px; --fs-2: 13.5px; --fs-3: 15px; --fs-b: 16px;
                --fs-4: 17px; --fs-5: 20px; --fs-6: 26px; --fs-7: 34px;
                --r-xs: 4px; --r-s: 8px; --r-m: 12px; --r-l: 14px;
                color-scheme: light;
            }
            /* The greens were the ones this block used to leave behind, and
               they are the page: the button, the field's focus edge, the
               theme control. A green tuned for a sand background is a smudge on
               a near-black one — and the error line, the single sentence that
               tells someone their password was wrong, was the worst of them
               at 2.92:1. */
            /* Three blocks rather than one, so the button below can reach
               them. Until 18/09/2026 the dark palette lived only in the media
               query — the machine's answer, with no way to overrule it — on
               the one page every person Roni shares a link with meets first.
               The dashboards BEHIND this door have had a toggle since 24/08
               and keep the choice under the same `being.theme` key on this
               same origin, so the door was the one surface on the share site
               that ignored what the reader had already asked for. */
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                --sage: #8fb3a0;
                --logo: #d9d3d0;
                --logo-accent: #dba9a4;
                --sage-deep: #a9c9b7;
                --sage-ink: #a9c9b7;
                --on-sage: #14201a;
                --danger: #e08b84;
                --sand: #1a1f1c;
                --ink: #e8e8e8;
                --muted: #9aa79f;
                --card: #242a26;
                --line: rgba(255, 255, 255, 0.10);
                color-scheme: dark;
                }
            }
            :root[data-theme="dark"] {
                --sage: #8fb3a0;
                --logo: #d9d3d0;
                --logo-accent: #dba9a4;
                --sage-deep: #a9c9b7;
                --sage-ink: #a9c9b7;
                --on-sage: #14201a;
                --danger: #e08b84;
                --sand: #1a1f1c;
                --ink: #e8e8e8;
                --muted: #9aa79f;
                --card: #242a26;
                --line: rgba(255, 255, 255, 0.10);
                color-scheme: dark;
            }
            * { box-sizing: border-box; }
            /* min-height, not height: a centred flex body with a FIXED height
               pushes anything taller than the viewport off the top, with no
               way to scroll up to it — on a short phone in landscape the logo
               was the part that vanished. With a minimum the body grows with
               its content instead, and the page scrolls. */
            html { height: 100%; }
            body {
                min-height: 100%;
                margin: 0;
                font-family: "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: var(--sand);
                color: var(--ink);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                -webkit-font-smoothing: antialiased;
                /* iOS inflates text in landscape without this. */
                -webkit-text-size-adjust: 100%;
            }
            .hidden { display: none !important; }
            /* Pinned to the corner rather than placed in the flow: the page is
               one centred card and there is no chrome to put a control in.
               inset-inline-end, not right — this document is RTL, and the
               logical property puts it at the left edge where the eye looks
               for something that is not part of the reading. */
            .theme-float {
                position: fixed;
                top: 14px;
                inset-inline-end: 14px;
                z-index: 5;
                /* staticrypt ships its own stylesheet into this page and the
                   gate's sibling pages style their submit with a bare
                   `button{width:100%}`. Declared here so neither can stretch
                   this one into a bar across the top. */
                width: auto;
                font: inherit;
                font-size: var(--fs-2);
                line-height: 1;
                padding: 9px 12px;
                min-height: 40px;
                color: var(--muted);
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 99px;
                cursor: pointer;
            }
            .theme-float:hover { color: var(--ink); border-color: var(--sage); }
            .theme-float:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
            /* A finger is not a pointer: 44px on a touch screen, which is the
               size both Apple's and Google's guidance name. */
            @media (pointer: coarse) { .theme-float { min-height: 44px; padding: 11px 14px; } }
            /* The gate's moon and sun (gate/src/routes/icons.ts): the stylesheet
               shows the one that matches the page, the same two selectors the
               dark tokens use, so the script only changes the word. */
            .theme-float { display: inline-flex; align-items: center; gap: 5px; }
            .theme-float .tt-i { display: flex; }
            .theme-float .tt-i svg[data-i="sun"] { display: none; }
            :root[data-theme="dark"] .theme-float .tt-i svg[data-i="sun"] { display: block; }
            :root[data-theme="dark"] .theme-float .tt-i svg[data-i="moon"] { display: none; }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) .theme-float .tt-i svg[data-i="sun"] { display: block; }
                :root:not([data-theme="light"]) .theme-float .tt-i svg[data-i="moon"] { display: none; }
            }

            .staticrypt-page { width: 100%; max-width: 400px; }

            .brand {
                text-align: center;
                margin-bottom: 26px;
            }
            /* The logo (docs/brand), breathing: one slow cycle of opacity, 4s in,
               4s out — the only motion on the page. Opacity and never scale: a
               logo that grows and shrinks reads as loading. */
            .brand h1.logo {
                display: flex; justify-content: center;
                margin: 0 0 12px;
                color: var(--logo);
                animation: breathe 8s ease-in-out infinite;
            }
            .brand h1.logo svg { display: block; }
            @keyframes breathe {
                0%, 100% { opacity: 0.78; }
                50%      { opacity: 1; }
            }
            @media (prefers-reduced-motion: reduce) {
                .brand h1.logo { animation: none; }
            }
            /* The line the logo carries under the wordmark, in the logo's rust. */
            .brand p {
                margin: 0;
                font-size: var(--fs-2);
                color: var(--logo-accent);
                letter-spacing: 0.02em;
                line-height: 1.6;
            }

            .staticrypt-form {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: var(--r-l);
                padding: 26px 24px;
            }
            .staticrypt-instructions { text-align: center; }
            .staticrypt-title {
                margin: 0 0 6px;
                font-size: var(--fs-3);
                font-weight: 500;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                margin: 0;
                font-size: var(--fs-2);
                color: var(--muted);
                line-height: 1.65;
            }
            .staticrypt-hr {
                border: none;
                border-top: 1px solid var(--line);
                margin: 20px 0;
            }

            .staticrypt-password-container { position: relative; }
            #staticrypt-password {
                width: 100%;
                padding: 13px 15px;
                padding-left: 44px;
                font-family: inherit;
                /* 16px, not 15: under 16 iOS Safari zooms the page in the
                   moment this field takes focus and never zooms back out.
                   This is the first field anyone taps on the shared link, so
                   the whole site opened one pinch behind. The button below
                   stays 15px — it takes no text, so it triggers nothing. */
                font-size: var(--fs-b);
                color: var(--ink);
                background: transparent;
                border: 1px solid var(--line);
                border-radius: var(--r-m);
                outline: none;
                transition: border-color 0.2s;
            }
            #staticrypt-password:focus { border-color: var(--sage); }
            #staticrypt-password::placeholder { color: var(--muted); opacity: 0.75; }

            .staticrypt-toggle-password-visibility {
                position: absolute;
                left: 14px; top: 50%;
                transform: translateY(-50%);
                width: 19px;
                cursor: pointer;
                opacity: 0.4;
                transition: opacity 0.2s;
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.75; }
            @media (prefers-color-scheme: dark) {
                .staticrypt-toggle-password-visibility { filter: invert(0.85); }
            }

            /* Inline, in place — the stock template raises a browser alert(),
               which on a shared link reads like something went wrong. */
            .gate-error {
                margin-top: 10px;
                font-size: var(--fs-2);
                color: var(--danger);
                text-align: center;
                min-height: 18px;
            }

            .staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 16px;
                font-size: var(--fs-2);
                color: var(--muted);
                cursor: pointer;
            }
            #staticrypt-remember { accent-color: var(--sage); width: 15px; height: 15px; cursor: pointer; }

            .staticrypt-decrypt-button {
                width: 100%;
                margin-top: 20px;
                padding: 13px;
                font-family: inherit;
                font-size: var(--fs-3);
                font-weight: 500;
                color: var(--on-sage);
                background: var(--sage);
                border: none;
                border-radius: var(--r-m);
                cursor: pointer;
                transition: background 0.2s;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus { background: var(--sage-deep); }

            .foot {
                margin-top: 20px;
                text-align: center;
                font-size: var(--fs-1);
                color: var(--muted);
                opacity: 0.8;
                line-height: 1.7;
            }

            .staticrypt-spinner-container { text-align: center; padding: 60px 0; }
            .staticrypt-spinner {
                display: inline-block;
                width: 34px; height: 34px;
                border: 2px solid var(--line);
                border-top-color: var(--sage);
                border-radius: 50%;
                animation: spin 0.9s linear infinite;
            }
            @keyframes spin { to { transform: rotate(360deg); } }
        </style>

        />

    <body class="staticrypt-body">
        <button type="button" id="theme-toggle" class="theme-float" aria-label="מעבר למצב כהה"><bdi class="tt-i" aria-hidden="true"><svg class="i" data-i="moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg><svg class="i" data-i="sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></bdi><bdi id="theme-word">כהה</bdi></button>
        <script>
            (function () {
                var root = document.documentElement;
                var btn = document.getElementById("theme-toggle");
                if (!btn) return;
                function isDark() {
                    var t = root.getAttribute("data-theme");
                    return t
                        ? t === "dark"
                        : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
                }
                function label() {
                    var d = isDark();
                    var w = document.getElementById("theme-word");
                    if (w) w.textContent = d ? "בהיר" : "כהה";
                    btn.setAttribute("aria-label", d ? "מעבר למצב בהיר" : "מעבר למצב כהה");
                }
                btn.addEventListener("click", function () {
                    var next = isDark() ? "light" : "dark";
                    root.setAttribute("data-theme", next);
                    try { window.localStorage.setItem("being.theme", next); } catch (e) {}
                    label();
                });
                label();
            })();
        </script>

        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

.3 83.1C243.7 91 231.2 106.8 225.5 120.9C215.2 146.1 216.2 178.2 228.1 202.5C239.5 226 258.3 240.7 286.8 248.1C296.9 250.8 321.9 251.8 335.4 250.1C351.3 248.1 371.1 241.7 377.2 236.7L379.9 234.5L379.2 222.3L378.5 210.1L374 212.8C357.8 222.7 335.7 227.7 312.5 226.7C284.8 225.5 266 216.2 253.9 197.7C249.9 191.5 245.5 179.6 244.4 171.8L243.8 167L314.8 167L385.8 167L386.4 163.9C386.7 162.2 387 156.2 387 150.6C386.9 112.7 366.1 82.4 332.5 71.4C325.5 69.1 322.5 68.7 309 68.4C300.5 68.3 291.4 68.5 288.8 69M439 159L439 246L451.5 246L464 246L464 159L464 72L451.5 72L439 72L439 159M805.3 91C787.4 94.8 770.1 107.8 761.8 123.6C751.5 143.2 751.4 171.7 761.6 191C774.5 215.7 800.6 228.7 829.4 224.9C845.6 222.8 856.8 217.3 868 206.1C880.9 193.1 887.1 177.8 887.3 158.5C887.6 131.5 875.2 109.2 853.5 97.7C843.1 92.1 837.4 90.8 823 90.4C815.6 90.2 807.6 90.5 805.3 91M290 92.6C269.3 98 253.5 113.4 247.1 134.4C243.4 146.3 236.4 145 303.5 145C370.8 145 363.3 146.5 360.4 133.7C355.7 113.2 342.1 98.6 322.2 92.9C314.1 90.6 298.2 90.4 290 92.6M79 93.4C55 98.5 37.5 114 29.3 137.5C26.8 144.9 26.6 146.7 26.6 160.5C26.6 174.3 26.8 176.1 29.3 183.5C37.1 205.8 53.1 220.4 76 226.1C83.1 227.9 86.3 228.2 96 227.7C114.7 226.8 128 221.3 140.3 209.2C147.8 201.8 154.7 189.6 157.5 178.5C159.7 169.7 159.5 150.3 157 140.6C151.3 118 133.9 100.4 111.5 94.5C103.1 92.3 87 91.7 79 93.4"/></svg></h1>
                    <p>מרכז וולנס באורוות האמנים פרדס-חנה</p>
                </div>

                <div class="staticrypt-form">
                    <div class="staticrypt-instructions">
                        <p class="staticrypt-title">הדשבורד</p>
                        <p>הדשבורד פתוח לצפייה עם הקוד שקיבלת. הדפדפן יזכור אותך.</p>
                    </div>

                    <hr class="staticrypt-hr" />

                    <form id="staticrypt-form" action="#" method="post">
                        <div class="staticrypt-password-container">
                            <input
                                id="staticrypt-password"
                                type="password"
                                name="password"
                                placeholder="הקוד"
                                autofocus
                            />

                            <img
                                class="staticrypt-toggle-password-visibility"
