        <!-- The saved choice, applied before the first paint. Same key the
             dashboards behind this door use (dash_assets.theme_boot), and the
             same origin, so the door and the pages it opens agree. -->
        <script>
            (function () {
                try {
                    var t = localStorage.getItem("being.theme");
                    if (t === "dark" || t === "light")
                        document.documentElement.setAttribute("data-theme", t);

        <style>
            /* being's share gate. The stock staticrypt page is a green box on a
               green background with an English "DECRYPT" button — the first
               thing anyone Roni shares with sees, and nothing to do with the
               place. This is the vault palette: sage, sand, one slow breath. */
            :root {
                --sage: #5a7a6a;
                --logo: #6c6467;
                --logo-accent: #7e5150;
                --sage-deep: #3d5a4d;
                --sage-ink: #41604f;
                --on-sage: #ffffff;
                --danger: #a4453f;
                --sand: #f5f0eb;
                --ink: #3a3a3a;
                --muted: #7a7a75;
                --card: #ffffff;
                --line: rgba(90, 122, 106, 0.18);
                color-scheme: light;
            }
            /* The greens were the ones this block used to leave behind, and
               they are the page: the button, the field's focus edge, the
               theme control. A green tuned for a sand background is a smudge on
               a near-black one — and the error line, the single sentence that
               tells someone their password was wrong, was the worst of them
               at 2.92:1. */
            /* Three blocks rather than one, so the button below can reach
               them. Until 18/09/2026 the dark palette lived only in the media
               query — the machine's answer, with no way to overrule it — on
               the one page every person Roni shares a link with meets first.
               The dashboards BEHIND this door have had a toggle since 24/08
               and keep the choice under the same `being.theme` key on this
               same origin, so the door was the one surface on the share site
               that ignored what the reader had already asked for. */
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                --sage: #8fb3a0;
                --logo: #d9d3d0;
                --logo-accent: #dba9a4;
                --sage-deep: #a9c9b7;
                --sage-ink: #a9c9b7;
                --on-sage: #14201a;
                --danger: #e08b84;
                --sand: #1a1f1c;
                --ink: #e8e8e8;
                --muted: #9aa79f;
                --card: #242a26;
                --line: rgba(255, 255, 255, 0.10);
                color-scheme: dark;
                }
            }
            :root[data-theme="dark"] {
                --sage: #8fb3a0;
                --logo: #d9d3d0;
                --logo-accent: #dba9a4;
                --sage-deep: #a9c9b7;
                --sage-ink: #a9c9b7;
                --on-sage: #14201a;
                --danger: #e08b84;
                --sand: #1a1f1c;
                --ink: #e8e8e8;
                --muted: #9aa79f;
                --card: #242a26;
                --line: rgba(255, 255, 255, 0.10);
                color-scheme: dark;
            }
            * { box-sizing: border-box; }
            /* min-height, not height: a centred flex body with a FIXED height
               pushes anything taller than the viewport off the top, with no
               way to scroll up to it — on a short phone in landscape the logo
               was the part that vanished. With a minimum the body grows with
               its content instead, and the page scrolls. */
            html { height: 100%; }
            body {
                min-height: 100%;
                margin: 0;
                font-family: "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: var(--sand);
                color: var(--ink);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                -webkit-font-smoothing: antialiased;
                /* iOS inflates text in landscape without this. */
                -webkit-text-size-adjust: 100%;
            }
            .hidden { display: none !important; }
            /* Pinned to the corner rather than placed in the flow: the page is
               one centred card and there is no chrome to put a control in.
               inset-inline-end, not right — this document is RTL, and the
               logical property puts it at the left edge where the eye looks
               for something that is not part of the reading. */
            .theme-float {
                position: fixed;
                top: 14px;
                inset-inline-end: 14px;
                z-index: 5;
                /* staticrypt ships its own stylesheet into this page and the
                   gate's sibling pages style their submit with a bare
                   `button{width:100%}`. Declared here so neither can stretch
                   this one into a bar across the top. */
                width: auto;
                font: inherit;
                font-size: 13px;
                line-height: 1;
                padding: 9px 12px;
                min-height: 40px;
                color: var(--muted);
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 99px;
                cursor: pointer;
            }
            .theme-float:hover { color: var(--ink); border-color: var(--sage); }
            .theme-float:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
            /* A finger is not a pointer: 44px on a touch screen, which is the
               size both Apple's and Google's guidance name. */
            @media (pointer: coarse) { .theme-float { min-height: 44px; padding: 11px 14px; } }

            .staticrypt-page { width: 100%; max-width: 400px; }

            .brand {
                text-align: center;
                margin-bottom: 26px;
            }
            /* The logo (docs/brand), breathing: one slow cycle of opacity, 4s in,
               4s out — the only motion on the page. Opacity and never scale: a
               logo that grows and shrinks reads as loading. */
            .brand h1.logo {
                display: flex; justify-content: center;
                margin: 0 0 12px;
                color: var(--logo);
                animation: breathe 8s ease-in-out infinite;
            }
            .brand h1.logo svg { display: block; }
            @keyframes breathe {
                0%, 100% { opacity: 0.78; }
                50%      { opacity: 1; }
            }
            @media (prefers-reduced-motion: reduce) {
                .brand h1.logo { animation: none; }
            }
            /* The line the logo carries under the wordmark, in the logo's rust. */
            .brand p {
                margin: 0;
                font-size: 13.5px;
                color: var(--logo-accent);
                letter-spacing: 0.02em;
                line-height: 1.6;
            }

            .staticrypt-form {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 16px;
                padding: 26px 24px;
            }
            .staticrypt-instructions { text-align: center; }
            .staticrypt-title {
                margin: 0 0 6px;
                font-size: 15px;
                font-weight: 500;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                margin: 0;
                font-size: 13px;
                color: var(--muted);
                line-height: 1.65;
            }
            .staticrypt-hr {
                border: none;
                border-top: 1px solid var(--line);
                margin: 20px 0;
            }

            .staticrypt-password-container { position: relative; }
            #staticrypt-password {
                width: 100%;
                padding: 13px 15px;
                padding-left: 44px;
                font-family: inherit;
                /* 16px, not 15: under 16 iOS Safari zooms the page in the
                   moment this field takes focus and never zooms back out.
                   This is the first field anyone taps on the shared link, so
                   the whole site opened one pinch behind. The button below
                   stays 15px — it takes no text, so it triggers nothing. */
                font-size: 16px;
                color: var(--ink);
                background: transparent;
                border: 1px solid var(--line);
                border-radius: 10px;
                outline: none;
                transition: border-color 0.2s;
            }
            #staticrypt-password:focus { border-color: var(--sage); }
            #staticrypt-password::placeholder { color: var(--muted); opacity: 0.75; }

            .staticrypt-toggle-password-visibility {
                position: absolute;
                left: 14px; top: 50%;
                transform: translateY(-50%);
                width: 19px;
                cursor: pointer;
                opacity: 0.4;
                transition: opacity 0.2s;
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.75; }
            @media (prefers-color-scheme: dark) {
                .staticrypt-toggle-password-visibility { filter: invert(0.85); }
            }

            /* Inline, in place — the stock template raises a browser alert(),
               which on a shared link reads like something went wrong. */
            .gate-error {
                margin-top: 10px;
                font-size: 13px;
                color: var(--danger);
                text-align: center;
                min-height: 18px;
            }

            .staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 16px;
                font-size: 13px;
                color: var(--muted);
                cursor: pointer;
            }
            #staticrypt-remember { accent-color: var(--sage); width: 15px; height: 15px; cursor: pointer; }

            .staticrypt-decrypt-button {
                width: 100%;
                margin-top: 20px;
                padding: 13px;
                font-family: inherit;
                font-size: 15px;
                font-weight: 500;
                color: var(--on-sage);
                background: var(--sage);
                border: none;
                border-radius: 10px;
                cursor: pointer;
                transition: background 0.2s;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus { background: var(--sage-deep); }

            .foot {
                margin-top: 20px;
                text-align: center;
                font-size: 11.5px;
                color: var(--muted);
                opacity: 0.8;
                line-height: 1.7;
            }

            .staticrypt-spinner-container { text-align: center; padding: 60px 0; }
            .staticrypt-spinner {
                display: inline-block;
                width: 34px; height: 34px;
                border: 2px solid var(--line);
                border-top-color: var(--sage);
                border-radius: 50%;
                animation: spin 0.9s linear infinite;
            }
            @keyframes spin { to { transform: rotate(360deg); } }

            (function () {
                var root = document.documentElement;
                var btn = document.getElementById("theme-toggle");
                if (!btn) return;
                function isDark() {
                    var t = root.getAttribute("data-theme");
                    return t
                        ? t === "dark"
                        : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
                }
                function label() {
                    var d = isDark();
                    btn.textContent = d ? "☀️ בהיר" : "🌙 כהה";
                    btn.setAttribute("aria-label", d ? "מעבר למצב בהיר" : "מעבר למצב כהה");
                }
                btn.addEventListener("click", function () {
                    var next = isDark() ? "light" : "dark";
                    root.setAttribute("data-theme", next);
                    try { window.localStorage.setItem("being.theme", next); } catch (e) {}
                    label();
                });
                label();
            })();
